name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Extract the changelog section
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '$0 ~ "^## \\[" ver "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no \"## [$TAG]\" section"
            exit 1
          fi

      # No registry-url on purpose: it makes setup-node write an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN} and set that variable to its own
      # XXXXX-XXXXX placeholder, so npm sends a bogus credential and never falls
      # through to OIDC. npm reports that as a 404 on the PUT, not as an auth error.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; node 22 ships 10.9.x, which fails
      # with a misleading 404/ENEEDAUTH instead of a version error.
      - run: npm install -g npm@latest

      - name: Show the resolved npm version and auth config
        run: |
          npm --version
          npm config get registry
          echo "NODE_AUTH_TOKEN is ${NODE_AUTH_TOKEN:+SET}${NODE_AUTH_TOKEN:-UNSET}"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npm publish --access public

      # npm reports a failed OIDC exchange as a bare ENEEDAUTH. The debug log
      # records the exchange at verbose level whatever the console loglevel, and
      # is the only place npm says why — e.g. "package not found", meaning no
      # trusted publisher is registered for this package.
      - name: npm debug log
        if: failure()
        run: tail -80 /home/runner/.npm/_logs/*-debug-0.log

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
