name: OIDC probe

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Is the OIDC endpoint exposed to this job?
        run: |
          echo "REQUEST_URL   : ${ACTIONS_ID_TOKEN_REQUEST_URL:+SET}${ACTIONS_ID_TOKEN_REQUEST_URL:-UNSET}"
          echo "REQUEST_TOKEN : ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+SET}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-UNSET}"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::id-token: write did not reach the job"
            exit 1
          fi
          code=$(curl -s -o /tmp/tok.json -w '%{http_code}' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          echo "mint http=$code"
          python3 -c "
import base64,json,sys
t=json.load(open('/tmp/tok.json'))['value']
p=t.split('.')[1]; p+='='*(-len(p)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print(json.dumps({k:c[k] for k in ('iss','aud','sub','repository','workflow_ref','environment','job_workflow_ref') if k in c}, indent=2))
"
